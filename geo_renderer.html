function label(x,y,t,o={}){smartLabel(x,y,t,o)}
function sty(i,s){return `stroke="${esc(i.stroke??s.stroke??'#17202b')}" stroke-width="${n(i.strokeWidth,s.strokeWidth??.07)}" fill="${esc(i.fill??s.fill??'none')}" opacity="${n(i.opacity,1)}"`}
